<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قطعة الأمان</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root {
  color-scheme: light;
  --ink: #1B2733; --muted: #566677; --line: #E1E8EF; --card: #FFFFFF;
  --blue: #38ABE0; --blue-soft: #E8F4FC; --blue-text: #1B6C9C;
  --orange: #F98707; --orange-soft: #FFF0DC; --orange-text: #B85200;
  --green-soft: #E6F4DA; --green-text: #357A12; --red: #C62828; --red-soft: #FDE8E8;
  --shadow: 0 2px 10px rgba(27, 39, 51, 0.09);
  --font-display: "Baloo Bhaijaan 2", "Tajawal", "Segoe UI", Tahoma, sans-serif;
  --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; margin: 0;
  background: linear-gradient(180deg, #38ABE0 0, #74C2EB 45%, #FFFFFF 100%) 0 0 / 100% 100% no-repeat, #FFFFFF;
  min-height: 100vh; padding-block: 0 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body[data-theme="orange"] { background: linear-gradient(180deg, #F98707 0, #FDB864 45%, #FFFFFF 100%) 0 0 / 100% 100% no-repeat, #FFFFFF; }
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-top: 12px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--ink); text-decoration: none; }
.date { font-size: 13px; opacity: .75; }
.card { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; }
h2 { font-weight: 700; font-size: 19px; line-height: 1.4; }
h2.sec { font-size: 15px; margin: 6px 6px 0; opacity: .85; }
.id { display: flex; align-items: center; gap: 14px; }
.avatar { width: 76px; height: 76px; border-radius: 50%; background: var(--blue-soft); color: var(--blue-text); display: grid; place-items: center; flex: none; overflow: hidden; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(27,39,51,.18); }
.avatar.sm { width: 52px; height: 52px; border-width: 2px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }
.avatar svg.ic { width: 36px; height: 36px; }
.name { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.2; margin: 0; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 14px; margin: 0; }
.pill { display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.pill.absent { background: var(--red-soft); color: var(--red); }
.pill.present { background: var(--green-soft); color: var(--green-text); }
.pill.gray { background: #EEF2F5; color: var(--muted); }
svg.ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.alert { border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.alert.danger { background: var(--red-soft); color: var(--red); }
.alert.accent { background: var(--orange-soft); color: var(--orange-text); }
.alert .label { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
.alert .value { font-size: 20px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chip { background: var(--blue-soft); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.chip .label { display: flex; align-items: center; gap: 6px; color: var(--blue-text); font-size: 13px; font-weight: 700; }
.chip .value { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.instr { border: 1.5px dashed var(--line); border-radius: 14px; padding: 10px 12px; }
.instr .label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
.instr p { margin: 4px 0 0; font-weight: 500; overflow-wrap: anywhere; }
.contact { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.contact:first-of-type { border-top: 0; }
.contact .role { font-size: 12px; color: var(--muted); font-weight: 700; }
.contact .cname { font-weight: 700; }
.phone { direction: ltr; text-align: right; unicode-bidi: isolate; font-variant-numeric: tabular-nums; font-weight: 700; user-select: all; }
.acts { display: flex; gap: 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 .btn { padding: 0 8px; font-size: 15px; white-space: nowrap; }
.btn { min-height: 48px; border-radius: 999px; border: 0; font-family: var(--font-display); font-weight: 700; font-size: 17px; padding: 0 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer; color: var(--ink); box-shadow: 0 3px 8px rgba(27,39,51,.15); }
.btn.primary { background: var(--orange); }
.btn.blue { background: var(--blue); }
.btn.ghost { background: #fff; border: 1.5px solid var(--line); box-shadow: none; }
.btn.danger { background: var(--red); color: #fff; }
.btn.sm { min-height: 40px; font-size: 15px; padding: 0 16px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--blue-text); outline-offset: 2px; }
.small { font-size: 13px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); text-align: center; padding: 0 8px; margin: 0; }
.back { align-self: flex-start; }
.preview-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.preview-bar p { margin: 0; font-weight: 700; flex: 1 1 180px; }
.nav { display: flex; gap: 6px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: rgba(255,255,255,.85); color: var(--muted); font-family: var(--font-display); font-weight: 700; font-size: 14px; padding: 7px 14px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow); }
.tab[aria-current="true"] { background: var(--ink); color: #fff; }
.badge { background: var(--red); color: #fff; border-radius: 999px; font-size: 12px; min-width: 20px; height: 20px; display: inline-grid; place-items: center; padding: 0 5px; }
.med { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.med:first-of-type { border-top: 0; }
.med .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.med .n { font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 14px; font-weight: 700; }
.field .opt { color: var(--muted); font-weight: 500; }
input[type="file"] { font: inherit; font-size: 14px; width: 100%; min-width: 0; }
input[type="text"], input[type="time"], input[type="tel"], input[type="email"], input[type="password"], input[type="search"], select { font: inherit; padding: 10px 12px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); min-width: 0; width: 100%; }
.check { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; }
.check input { margin-top: 5px; width: 18px; height: 18px; flex: none; }
.panel { border-radius: 16px; border: 2px solid var(--orange); background: #fff; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.notif { border-radius: 14px; background: #F3F7FA; padding: 10px 12px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.notif.unread { background: var(--blue-soft); }
.notif b { font-weight: 800; }
.scan { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.scan:first-of-type { border-top: 0; }
.scan .who { font-weight: 700; }
.scan svg.ic { margin-top: 3px; color: var(--blue-text); }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.item:first-child { border-top: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 700; overflow-wrap: anywhere; }
.err { background: var(--red-soft); color: var(--red); border-radius: 14px; padding: 10px 12px; font-weight: 700; font-size: 14px; }
.okbox { background: var(--green-soft); color: var(--green-text); border-radius: 14px; padding: 10px 12px; font-weight: 700; font-size: 14px; }
.code { font-family: ui-monospace, Consolas, monospace; direction: ltr; unicode-bidi: isolate; font-size: 22px; font-weight: 800; letter-spacing: 2px; text-align: center; background: #F3F7FA; border-radius: 14px; padding: 10px; user-select: all; }
.url { direction: ltr; unicode-bidi: isolate; font-size: 13px; word-break: break-all; background: #F3F7FA; border-radius: 12px; padding: 8px 10px; user-select: all; }
.brands { margin-top: 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.brandrow { display: flex; align-items: center; justify-content: center; gap: 16px; }
.erawda { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.erawda img.w { width: 128px; height: auto; display: block; }
.erawda img.t { width: 116px; height: auto; display: block; }
.vr { width: 1.5px; align-self: stretch; background: rgba(27,39,51,.18); border-radius: 2px; }
.ronaq { height: 84px; width: auto; display: block; }
.toast { position: fixed; bottom: max(14px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 999px; font-weight: 700; z-index: 10; max-width: 92vw; text-align: center; }
.center { text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head><body>

    var rows = list.map(function (n) {

      return '<div class="notif' + (n.read_at ? '' : ' unread') + '"><b>' + esc(n.title) + '</b><span>' + esc(n.body || '') + '</span>' +
        (p.maps ? '<a class="btn primary sm" href="' + esc(p.maps) + '" target="_blank" rel="noopener">' + ic('pin') + 'فتح الخريطة</a>' : '') +
        '<span class="small">' + esc(when(n.created_at)) + '</span></div>';
    }).join('');
    api.markAllRead().then(function () { S.unread = 0; }).catch(function () {});
    return chrome('<section class="card stack"><h2>الإشعارات</h2>' + (rows || '<p class="small" style="margin:0">لا توجد إشعارات.</p>') + '</section>', 'notifs', 'blue');
  };

  pages.teacher = async function () {
    var kg = myKg('teacher') || myKgAny();
    var res = await Promise.all([api.kgChildren(kg), api.todayMeds(kg)]);
    var kids = res[0], meds = res[1].filter(function (m) { return !m.given; });
    S.cur = { kids: kids };
    var medRows = meds.map(function (m) {
      return '<div class="med"><div><div class="n">' + esc(m.name) + '</div><div class="t">' + esc(m.child_name) + ' · ' + esc(m.time) + '</div></div><button class="btn primary sm" data-action="give" data-id="' + esc(m.id) + '">تم</button></div>';
    }).join('');
    return chrome('<section class="card"><h2>أدوية اليوم المتبقية</h2>' + (medRows || '<p class="small" style="margin:6px 0 0">لا توجد أدوية متبقية اليوم.</p>') + '</section>' +
      '<section class="card"><h2>الأطفال</h2><div class="field" style="margin:8px 0"><input id="q" type="search" placeholder="ابحث بالاسم"></div><div id="list">' + kidList(kids, '', '#/kid/') + '</div></section>', 'teacher', 'orange');
  };
  function kidList(kids, q, href) {
    var rows = kids.filter(function (k) { return !q || k.name.indexOf(q) > -1; }).map(function (k) {
      return '<a class="item" href="' + href + esc(k.id) + '"><div class="grow"><div class="t">' + esc(k.name) + '</div><div class="small">' + esc(k.cls || '') + '</div></div>' + (k.active === false ? '<span class="pill gray">متوقف</span>' : '') + ic('chev') + '</a>';
    }).join('');
    return rows || '<p class="small">لا نتائج.</p>';
  }

  pages.kid = async function (r) {
    var d = await api.childDetail(r.id);
    S.cur = { d: d, token: d.token, viewer: 'teacher' };
    S.token = d.token;
    return chrome(backBtn('#/teacher') + idCard(d, true) + medsToday(d) + pageBody(d, 'teacher'), 'teacher', 'orange');
  };

  pages.admin = async function () {
    var kg = myKg('kg_admin');
    var res = await Promise.all([api.kgChildren(kg), api.invites(kg)]);
    S.cur = { kids: res[0], kg: kg };
    var open = res[1].filter(function (i) { return !i.used_at && new Date(i.expires_at) > new Date(); }).length;
    return chrome('<section class="card stack"><h2>الإدارة</h2><div class="row2"><a class="btn blue" href="#/admin-new">إضافة طفل</a><a class="btn ghost" href="#/admin-invites">الدعوات (' + open + ')</a></div></section>' +
      '<section class="card"><h2>الأطفال (' + res[0].length + ')</h2><div class="field" style="margin:8px 0"><input id="q" type="search" placeholder="ابحث بالاسم"></div><div id="list">' + kidList(res[0], '', '#/admin-child/') + '</div></section>', 'admin', 'orange');
  };

  pages['admin-new'] = async function () {
    var kg = myKg('kg_admin');
    var cls = await api.classes(kg);
    S.cur = { kg: kg };
    var opts = '<option value="">بدون صف</option>' + cls.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join('');
    return chrome(backBtn('#/admin') + '<section class="card stack"><h2>إضافة طفل</h2><div id="msg"></div>' + field('n-name', 'اسم الطفل', '') +
      '<div class="field"><label for="n-class">الصف</label><select id="n-class">' + opts + '</select></div>' +
      field('n-newclass', 'أو أضف صفاً جديداً', '', 'text', true) +
      '<button class="btn blue block" data-action="createchild">إنشاء</button></section><div id="result"></div>', 'admin', 'orange');
  };

  pages['admin-child'] = async function (r) {
    var d = await api.childDetail(r.id);
    S.cur = { d: d, kg: d.kindergarten_id };
    var url = d.token ? tagUrl(d.token) : '';
    return chrome(backBtn('#/admin') + '<section class="card stack"><h2>' + esc(d.name) + '</h2><p class="sub">' + esc(d['class'] || 'بدون صف') + '</p>' +
      (url ? '<div><strong>رابط القطعة (يُكتب على NFC)</strong></div><div class="url">' + esc(url) + '</div><button class="btn ghost sm" data-action="copyurl" data-v="' + esc(url) + '">نسخ الرابط</button>' +
        '<div>' + (d.tag_active ? '<span class="pill present">القطعة مفعّلة</span>' : '<span class="pill absent">القطعة متوقفة</span>') + '</div>' +
        '<button class="btn ghost sm" data-action="tagactive" data-v="' + (d.tag_active ? '0' : '1') + '">' + (d.tag_active ? 'إيقاف القطعة (فُقدت)' : 'إعادة التفعيل') + '</button>' : '<p class="small">لا توجد قطعة لهذا الطفل.</p>') +
      '</section><section class="card stack"><h2>دعوة ولي أمر</h2><p class="small" style="margin:0">أنشئ كوداً وأعطه لولي الأمر ليربط حسابه بالطفل. صالح 14 يوماً ويُستخدم مرة واحدة.</p><div id="result"></div>' +
      '<button class="btn blue block" data-action="guardianinvite">إنشاء كود دعوة</button></section>', 'admin', 'orange');
  };

  pages['admin-invites'] = async function () {
    var kg = myKg('kg_admin');
    var list = await api.invites(kg);
    S.cur = { kg: kg };
    var rows = list.map(function (i) {
      var st = i.used_at ? '<span class="pill gray">مستخدم</span>' : (new Date(i.expires_at) < new Date() ? '<span class="pill gray">منتهي</span>' : '<span class="pill present">فعّال</span>');
      var who = i.kind === 'guardian' ? 'ولي أمر ' + esc((one1(i.children) || {}).full_name || '') : i.kind === 'teacher' ? 'معلمة' : 'مديرة';
      return '<div class="item"><div class="grow"><div class="code" style="font-size:16px;text-align:right">' + esc(i.code) + '</div><div class="small">' + who + '</div></div>' + st + '</div>';
    }).join('');
    return chrome(backBtn('#/admin') + '<section class="card stack"><h2>دعوة معلمة</h2><div id="result"></div><button class="btn blue block" data-action="teacherinvite">إنشاء كود لمعلمة</button></section>' +
      '<section class="card"><h2>آخر الدعوات</h2>' + (rows || '<p class="small">لا توجد دعوات.</p>') + '</section>', 'admin', 'orange');
  };
  function one1(x) { return Array.isArray(x) ? x[0] : x; }

  pages.super = async function () {
    var kgs = await api.kindergartens();
    S.cur = {};
    var rows = kgs.map(function (k) {
      return '<div class="item"><div class="grow"><div class="t">' + esc(k.name) + '</div><div class="small">' + esc(k.city || '') + '</div></div><button class="btn ghost sm" data-action="adminInvite" data-id="' + esc(k.id) + '">كود مديرة</button></div>';
    }).join('');
    return chrome('<section class="card stack"><h2>إضافة روضة</h2><div id="msg"></div>' + field('k-name', 'اسم الروضة', '') + field('k-city', 'المدينة', '', 'text', true) +
      '<button class="btn blue block" data-action="addkg">إضافة</button></section><section class="card stack"><h2>الروضات (' + kgs.length + ')</h2><div id="result"></div>' + (rows || '<p class="small">لا توجد روضات.</p>') + '</section>', 'super', 'orange');
  };

  /* ───────── router ───────── */
  var seq = 0;
  async function route() {
    var my = ++seq;
    var q = new URLSearchParams(location.search);
    var h = (location.hash || '').replace(/^#\/?/, '').split('/');
    var name = h[0] || '', id = h[1] || '';
    S.found = null;
    app.innerHTML = '<div class="card center"><p class="small" style="margin:0">جاري التحميل…</p></div>';
    try {
      if (!api) api = makeApi();
      S.user = await api.session();
      S.roles = null; S.unread = 0;
      if (S.user) { try { S.roles = await api.roles(); S.unread = await api.unread(); } catch (e) { S.roles = { super: false, staff: [], children: 0 }; } }
      var html;
      if (q.get('t')) { S.token = q.get('t'); html = await pages.tag(); }
      else {
        var open = { login: 1, signup: 1 };
        if (!S.user && !open[name]) { location.hash = '#/login'; return; }
        if (S.user && open[name]) { location.hash = '#/home'; return; }
        var page = pages[name || 'home'];
        html = page ? await page({ id: id }) : await pages.home();
      }
      if (my !== seq) return;
      app.innerHTML = html;
      try { window.scrollTo(0, 0); } catch (e) {}
    } catch (e) {
      if (my !== seq) return;
      app.innerHTML = chrome('<section class="card stack center"><h2>تعذر تحميل الصفحة</h2><div class="err">' + esc(msg(e)) + '</div><button class="btn blue" data-action="reload">إعادة المحاولة</button></section>', '', 'blue');
    }
  }

  /* ───────── actions ───────── */
  function showErr(text) { var m = document.getElementById('msg'); if (m) m.innerHTML = '<div class="err">' + esc(text) + '</div>'; else say(text); }
  function busy(el, on) { if (el) { el.disabled = !!on; } }

  function collectChild() {
    var cts = [];
    var p1 = val('f-c1phone'), p2 = val('f-c2phone');
    if (!val('f-name')) throw new Error('اكتب اسم الطفل.');
    if (!p1) throw new Error('رقم جوال جهة الاتصال الأساسية مطلوب.');
    cts.push({ name: val('f-c1name') || 'ولي الأمر', phone: p1 });
    if (p2) cts.push({ name: val('f-c2name') || 'رقم طوارئ آخر', phone: p2 });
    [p1, p2].forEach(function (p) { if (p && !/^[0-9+() -]{6,20}$/.test(p)) throw new Error('رقم الجوال غير صحيح: ' + p); });
    var b = document.getElementById('f-blood');
    var fields = {
      full_name: val('f-name'), allergy: nz(val('f-allergy')), chronic: nz(val('f-chronic')), emergency_med: nz(val('f-emerg')),
      blood_type: b && b.value ? b.value : null, instructions: nz(val('f-instr')),
      photo_data: S.cur.photo || null, photo_public: !!(document.getElementById('f-photopub') || {}).checked
    };
    return { fields: fields, contacts: cts };
  }

  var actions = {
    reload: function () { route(); },
    logout: async function () { await api.signOut(); S.user = null; location.hash = '#/login'; route(); },
    login: async function (el) {
      var e = val('l-email'), p = document.getElementById('l-pass').value;
      if (!e || !p) return showErr('اكتب البريد وكلمة السر.');
      busy(el, 1);
      try { await api.signIn(e, p); var u = await api.session(); if (u) await api.ensureProfile(u); location.hash = '#/home'; route(); }
      catch (err) { showErr(msg(err)); busy(el, 0); }
    },
    signup: async function (el) {
      var name = val('s-name'), phone = val('s-phone'), e = val('s-email'), p = document.getElementById('s-pass').value, code = normCode(val('s-code'));
      if (!name || !phone || !e || !p) return showErr('عبّئ كل الحقول المطلوبة.');
      if (p.length < 8) return showErr('كلمة السر 8 أحرف على الأقل.');
      if (!document.getElementById('s-ok').checked) return showErr('يجب الموافقة على الشروط للمتابعة.');
      busy(el, 1);
      try {
        var r = await api.signUp(e, p, { full_name: name, phone: phone });
        var u = r && r.session ? r.user : null;
        if (!u) { document.getElementById('msg').innerHTML = '<div class="okbox">تم إنشاء الحساب. افتح بريدك واضغط رابط التأكيد، ثم سجّل دخولك وأدخل كود الدعوة.</div>'; busy(el, 0); return; }
        await api.ensureProfile(u);
        if (code) { try { await api.redeem(code); } catch (err) { say(msg(err)); } }
        location.hash = '#/home'; route();
      } catch (err) { showErr(msg(err)); busy(el, 0); }
    },
    redeem: async function (el) {
      var code = normCode(val('r-code')); if (!code) return showErr('اكتب الكود.');
      busy(el, 1);
      try { var r = await api.redeem(code); say('تم الربط بنجاح'); location.hash = r.kind === 'guardian' ? '#/home' : r.kind === 'teacher' ? '#/teacher' : '#/admin'; route(); }
      catch (err) { showErr(msg(err)); busy(el, 0); }
    },
    copyphone: function (el) { copy(el.getAttribute('data-v')); },
    copyurl: function (el) { copy(el.getAttribute('data-v')); },
    copycode: function (el) { copy(el.getAttribute('data-v')); },
    'found-preview': function () { say('هذا الزر يظهر لمن يمسح القطعة'); },
    found: function () { S.found = { step: 'ask' }; rerenderFound(); },
    'found-no': function () { S.found = null; rerenderFound(); },
    'found-yes': function () {
      S.found = { step: 'wait' }; rerenderFound();
      var token = (S.cur && S.cur.token) || S.token;
      if (!navigator.geolocation) { S.found = { step: 'err', text: 'جهازك لا يدعم تحديد الموقع.' }; return rerenderFound(); }
      navigator.geolocation.getCurrentPosition(function (p) {
        api.sendLocation(token, p.coords.latitude, p.coords.longitude).then(function (sent) {
          S.found = sent ? { step: 'done', time: nowStr() } : { step: 'err', text: 'تم إرسال موقع قبل قليل. انتظر بضع دقائق ثم حاول مرة أخرى.' };
          rerenderFound();
        }).catch(function (err) { S.found = { step: 'err', text: msg(err) }; rerenderFound(); });
      }, function () { S.found = { step: 'err', text: 'تعذر تحديد موقعك. فعّل خدمة الموقع وأعطِ المتصفح الإذن ثم حاول مرة أخرى.' }; rerenderFound(); }, { timeout: 10000, maximumAge: 0, enableHighAccuracy: true });
    },
    give: async function (el) {
      busy(el, 1);
      try { await api.giveMed(el.getAttribute('data-id'), S.user.id); say('تم تسجيل إعطاء الدواء'); route(); }
      catch (err) { say(msg(err)); busy(el, 0); }
    },
    absent: async function (el) {
      busy(el, 1);
      try { var on = el.getAttribute('data-v') === '1'; await api.setAbsent(S.cur.d.id, on, S.user.id); say(on ? 'تم إبلاغ الروضة بالغياب' : 'تم إلغاء الإبلاغ'); route(); }
      catch (err) { say(msg(err)); busy(el, 0); }
    },
    'photo-remove': function () { S.cur.photo = null; var a = document.getElementById('avatar'); say('ستُزال الصورة عند الحفظ'); },
    save: async function (el) {
      var c; try { c = collectChild(); } catch (err) { return showErr(err.message); }
      busy(el, 1);
      try { await api.saveChild(S.cur.d.id, c.fields, c.contacts); say('تم حفظ البيانات'); location.hash = '#/child/' + S.cur.d.id; }
      catch (err) { showErr(msg(err)); busy(el, 0); }
    },
    addmed: async function (el) {
      var n = val('m-name'), t = val('m-time') || '09:00';
      if (!n) return say('اكتب اسم الدواء أولاً');
      var c; try { c = collectChild(); } catch (err) { return showErr(err.message); }
      busy(el, 1);
      try { await api.saveChild(S.cur.d.id, c.fields, c.contacts); await api.addMed(S.cur.d.id, n, t); say('تمت إضافة الدواء'); route(); }
      catch (err) { showErr(msg(err)); busy(el, 0); }
    },
    delmed: async function (el) {
      var c; try { c = collectChild(); } catch (err) { return showErr(err.message); }
      try { await api.saveChild(S.cur.d.id, c.fields, c.contacts); await api.removeMed(el.getAttribute('data-id')); say('تم حذف الدواء'); route(); }
      catch (err) { showErr(msg(err)); }
    },
    createchild: async function (el) {
      var name = val('n-name'); if (!name) return showErr('اكتب اسم الطفل.');
      busy(el, 1);
      try {
        var classId = val('n-class'), nc = val('n-newclass');
        if (nc) classId = (await api.addClass(S.cur.kg, nc)).id;
        var c = await api.createChild(S.cur.kg, name, classId);
        var code = await api.createInvite('guardian', S.cur.kg, c.id, S.user.id);
        document.getElementById('msg').innerHTML = '';
        document.getElementById('result').innerHTML = '<section class="card stack"><div class="okbox">تم إنشاء ' + esc(name) + '</div>' +
          '<strong>1) رابط القطعة (اكتبه على NFC)</strong><div class="url">' + esc(tagUrl(c.token)) + '</div><button class="btn ghost sm" data-action="copyurl" data-v="' + esc(tagUrl(c.token)) + '">نسخ الرابط</button>' +
          '<strong>2) كود ولي الأمر</strong><div class="code">' + esc(code) + '</div><button class="btn ghost sm" data-action="copycode" data-v="' + esc(code) + '">نسخ الكود</button>' +
          '<a class="btn blue block" href="#/admin-new">إضافة طفل آخر</a></section>';
        el.style.display = 'none';
      } catch (err) { showErr(msg(err)); busy(el, 0); }
    },
    guardianinvite: async function (el) {
      busy(el, 1);
      try { var code = await api.createInvite('guardian', S.cur.kg, S.cur.d.id, S.user.id); document.getElementById('result').innerHTML = '<div class="code">' + esc(code) + '</div><button class="btn ghost sm" data-action="copycode" data-v="' + esc(code) + '">نسخ الكود</button>'; }
      catch (err) { say(msg(err)); }
      busy(el, 0);
    },
    teacherinvite: async function (el) {
      busy(el, 1);
      try { var code = await api.createInvite('teacher', S.cur.kg, null, S.user.id); document.getElementById('result').innerHTML = '<div class="code">' + esc(code) + '</div><button class="btn ghost sm" data-action="copycode" data-v="' + esc(code) + '">نسخ الكود</button>'; }
      catch (err) { say(msg(err)); }
      busy(el, 0);
    },
    tagactive: async function (el) {
      try { await api.setTagActive(S.cur.d.token, el.getAttribute('data-v') === '1'); say('تم التحديث'); route(); } catch (err) { say(msg(err)); }
    },
    addkg: async function (el) {
      var n = val('k-name'); if (!n) return showErr('اكتب اسم الروضة.');
      busy(el, 1);
      try { await api.addKg(n, val('k-city')); say('تمت إضافة الروضة'); route(); } catch (err) { showErr(msg(err)); busy(el, 0); }
    },
    adminInvite: async function (el) {
      try { var code = await api.createInvite('kg_admin', el.getAttribute('data-id'), null, S.user.id); document.getElementById('result').innerHTML = '<div class="okbox">كود مديرة الروضة</div><div class="code">' + esc(code) + '</div><button class="btn ghost sm" data-action="copycode" data-v="' + esc(code) + '">نسخ الكود</button>'; }
      catch (err) { say(msg(err)); }
    }
  };
  function rerenderFound() {
    // re-render only the last card that holds the found block, without touching forms
    var d = S.cur && S.cur.d, mode = S.cur && S.cur.viewer === 'teacher' ? 'teacher' : (S.cur && S.cur.viewer === 'parent' ? 'preview' : 'public');
    var holder = document.getElementById('foundholder');
    if (holder) holder.innerHTML = foundBlock(mode);
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]'); if (!el) return;
    var a = el.getAttribute('data-action');
    if (actions[a]) { e.preventDefault(); actions[a](el); }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id !== 'q') return;
    var q = e.target.value.trim(), kids = (S.cur && S.cur.kids) || [];
    var admin = /admin/.test(location.hash);
    document.getElementById('list').innerHTML = kidList(kids, q, admin ? '#/admin-child/' : '#/kid/');
  });
  app.addEventListener('change', function (e) {
    if (!e.target || e.target.id !== 'f-photo' || !e.target.files || !e.target.files[0]) return;
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        try {
          var s = Math.min(img.width, img.height), cv = document.createElement('canvas');
          cv.width = cv.height = 240;
          cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 240, 240);
          S.cur.photo = cv.toDataURL('image/jpeg', 0.82); say('تم اختيار الصورة. اضغط حفظ');
        } catch (err) { say('تعذر قراءة الصورة'); }
      };
      img.onerror = function () { say('تعذر قراءة الصورة'); };
      img.src = fr.result;
    };
    fr.readAsDataURL(e.target.files[0]);
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body></html>
