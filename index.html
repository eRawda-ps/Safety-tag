<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قطعة الأمان</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: eRawda's own system. Role-colored gradient on top fading to white, white rounded cards, orange pill buttons, brand footer. One light look, like the app. */
:root {
  color-scheme: light;
  --ink: #1B2733;
  --muted: #566677;
  --line: #E1E8EF;
  --card: #FFFFFF;
  --blue: #38ABE0;
  --blue-soft: #E8F4FC;
  --blue-text: #1B6C9C;
  --orange: #F98707;
  --orange-soft: #FFF0DC;
  --orange-text: #B85200;
  --green-soft: #E6F4DA;
  --green-text: #357A12;
  --red: #C62828;
  --red-soft: #FDE8E8;
  --shadow: 0 2px 10px rgba(27, 39, 51, 0.09);
  --font-display: "Baloo Bhaijaan 2", "Tajawal", "Segoe UI", Tahoma, sans-serif;
  --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  background: linear-gradient(180deg, #38ABE0 0, #74C2EB 45%, #FFFFFF 100%) 0 0 / 100% 100% no-repeat, #FFFFFF;
  padding-block: 0 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body[data-view="teacher"] { background: linear-gradient(180deg, #F98707 0, #FDB864 45%, #FFFFFF 100%) 0 0 / 100% 100% no-repeat, #FFFFFF; }
body[data-view="parent"] { background: linear-gradient(180deg, #38ABE0 0, #74C2EB 45%, #FFFFFF 100%) 0 0 / 100% 100% no-repeat, #FFFFFF; }
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.demo-bar { margin-top: 12px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.85); color: var(--orange-text); font-size: 13px; font-weight: 700; text-align: center; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.date { font-size: 13px; color: var(--ink); opacity: .75; }
.card { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 19px; margin: 0; line-height: 1.4; }
h2.sec { font-size: 15px; margin: 6px 6px 0; opacity: .85; }
.id { display: flex; align-items: center; gap: 14px; }
.avatar { width: 76px; height: 76px; border-radius: 50%; background: var(--blue-soft); color: var(--blue-text); display: grid; place-items: center; flex: none; overflow: hidden; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(27, 39, 51, 0.18); }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }
.avatar svg.ic { width: 38px; height: 38px; }
.name { font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1.2; margin: 0; }
.sub { color: var(--muted); font-size: 14px; margin: 0; }
.pill { display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.pill.absent { background: var(--red-soft); color: var(--red); }
.pill.present { background: var(--green-soft); color: var(--green-text); }
svg.ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.alert { border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.alert.danger { background: var(--red-soft); color: var(--red); }
.alert.accent { background: var(--orange-soft); color: var(--orange-text); }
.alert .label { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
.alert .value { font-size: 20px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chip { background: var(--blue-soft); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.chip .label { display: flex; align-items: center; gap: 6px; color: var(--blue-text); font-size: 13px; font-weight: 700; }
.chip .value { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.instr { border: 1.5px dashed var(--line); border-radius: 14px; padding: 10px 12px; }
.instr .label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
.instr p { margin: 4px 0 0; font-weight: 500; }
.contact { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.contact:first-of-type { border-top: 0; }
.contact .role { font-size: 12px; color: var(--muted); font-weight: 700; }
.contact .cname { font-weight: 700; }
.phone { direction: ltr; text-align: right; unicode-bidi: isolate; font-variant-numeric: tabular-nums; font-weight: 700; user-select: all; }
.acts { display: flex; gap: 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 .btn { padding: 0 8px; font-size: 15px; white-space: nowrap; }
.btn { min-height: 48px; border-radius: 999px; border: 0; font-family: var(--font-display); font-weight: 700; font-size: 17px; padding: 0 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer; color: var(--ink); box-shadow: 0 3px 8px rgba(27,39,51,.15); }
.btn.primary { background: var(--orange); }
.btn.blue { background: var(--blue); }
.btn.ghost { background: #fff; border: 1.5px solid var(--line); box-shadow: none; }
.btn.danger { background: var(--red); color: #fff; }
.btn.sm { min-height: 40px; font-size: 15px; padding: 0 16px; }
.btn.block { width: 100%; }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--blue-text); outline-offset: 2px; }
.small { font-size: 13px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); text-align: center; padding: 0 8px; margin: 0; }
.preview-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.preview-bar p { margin: 0; font-weight: 700; flex: 1 1 180px; }
.back { align-self: flex-start; }
.tabs { display: flex; gap: 6px; background: rgba(255,255,255,.9); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
.tab { flex: 1; border: 0; background: transparent; color: var(--muted); font-family: var(--font-display); font-weight: 700; font-size: 15px; padding: 8px 4px; border-radius: 999px; cursor: pointer; }
.tab[aria-current="true"] { background: var(--orange); color: var(--ink); }
body[data-view="parent"] .tab[aria-current="true"] { background: var(--blue); }
.med { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.med:first-of-type { border-top: 0; }
.med .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.med .n { font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 14px; font-weight: 700; }
.field .opt { color: var(--muted); font-weight: 500; }
input[type="file"] { font: inherit; font-size: 14px; width: 100%; min-width: 0; }
input[type="text"], input[type="time"], input[type="tel"], select { font: inherit; padding: 10px 12px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); min-width: 0; width: 100%; }
.panel { border-radius: 16px; border: 2px solid var(--orange); background: #fff; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.notif { border-radius: 14px; background: #F3F7FA; padding: 10px 12px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.scan { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.scan:first-of-type { border-top: 0; }
.scan .who { font-weight: 700; }
.scan svg.ic { margin-top: 3px; color: var(--blue-text); }
.brands { margin-top: 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.brandrow { display: flex; align-items: center; justify-content: center; gap: 16px; }
.erawda { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.erawda img.w { width: 128px; height: auto; display: block; }
.erawda img.t { width: 116px; height: auto; display: block; }
.vr { width: 1.5px; align-self: stretch; background: rgba(27,39,51,.18); border-radius: 2px; }
.ronaq { height: 84px; width: auto; display: block; }
.toast { position: sticky; bottom: max(12px, env(safe-area-inset-bottom, 0px)); align-self: center; background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 999px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head><body>

      '</section>' +
      '<section class="card stack"><h2>الاتصال بولي الأمر</h2>' + contactRow(c.c1, 'جهة الاتصال الأساسية', true) +
      (c.c2 && c.c2.phone ? contactRow(c.c2, 'رقم طوارئ آخر', false) : '') + '</section>' +
      '<section class="card stack"><h2>أرقام الطوارئ</h2><a class="btn danger block" href="tel:101">الإسعاف 101</a>' +
      '<div class="row2"><a class="btn ghost" href="tel:100">الشرطة 100</a><a class="btn ghost" href="tel:102">الدفاع المدني 102</a></div></section>' +
      '<section class="card stack">' + (teacher
        ? '<h2>إرسال موقعك لولي الأمر</h2><p class="small" style="margin:0">مثلاً أثناء رحلة أو في حالة طارئة.</p>'
        : '<h2>هل وجدت هذا الطفل؟</h2><p class="small" style="margin:0">اضغط الزر وسيصل ولي الأمر إشعار بمكانك.</p>') + foundBlock(mode) + '</section>' +
      (teacher ? '' : '<p class="note">هذه الصفحة تعرض الحد الأدنى من المعلومات فقط. أدخلها ولي الأمر بنفسه وبموافقته.</p>');
  }

  function emergencyView() { return idCard() + pageBody('public'); }

  function teacherView() {
    var meds = state.meds.map(function (m) {
      return '<div class="med"><div><div class="n">' + esc(m.name) + '</div><div class="t">الموعد ' + esc(m.time) + '</div></div>' +
        (m.given ? '<span class="pill present">تم الإعطاء</span>' : '<button class="btn primary sm" data-action="give" data-id="' + m.id + '">تم إعطاء الدواء</button>') + '</div>';
    }).join('');
    return idCard() +
      '<section class="card"><h2>أدوية اليوم</h2>' + (meds || '<p class="small">لا يوجد دواء مسجل.</p>') +
      '<p class="small" style="margin:8px 0 0">يصلك إشعار في موعد كل دواء. التطبيق تذكير فقط، وإعطاء الدواء يتم حسب تعليمات الروضة.</p></section>' +
      pageBody('teacher');
  }

  function parentView() {
    var scans = state.scans.map(function (s) {
      var notified = !s.reg || s.loc;
      return '<div class="scan">' + ic(notified ? 'bell' : 'info') + '<div><div class="who">' + esc(s.who) + '</div><div class="small">' + esc(s.when) + (notified ? ' · وصلك إشعار' : '') + (s.loc ? ' · مع الموقع' : '') + '</div></div></div>';
    }).join('');
    var meds = state.meds.map(function (m) { return '<div class="med"><div><div class="n">' + esc(m.name) + '</div><div class="t">' + esc(m.time) + '</div></div></div>'; }).join('');
    return '<section class="card preview-bar"><p>هكذا تظهر الصفحة لأي شخص يمسح القطعة</p><button class="btn blue sm" data-action="edit">' + ic('edit') + 'تعديل</button></section>' +
      idCard() + pageBody('preview') +
      '<h2 class="sec">للأهل فقط</h2>' +
      '<section class="card stack"><h2>سجل المسح</h2>' + scans + '<p class="small" style="margin:0">يصلك إشعار تلقائي عند كل مسح من شخص غير مسجل.</p></section>' +
      '<section class="card stack"><h2>أدوية الطفل</h2>' + (meds || '<p class="small" style="margin:0">لا يوجد دواء مسجل.</p>') +
      '<button class="btn ghost sm block" data-action="edit">إضافة أو تعديل الأدوية</button></section>' +
      '<section class="card stack"><h2>الغياب</h2>' +
      (state.absent ? '<p class="small" style="margin:0">تم إبلاغ الروضة بغياب اليوم.</p><button class="btn ghost block" data-action="absent">إلغاء الإبلاغ</button>'
                    : '<button class="btn danger block" data-action="absent">إبلاغ عن غياب اليوم</button>') + '</section>';
  }

  function photoBlock() {
    return '<div class="field"><label for="f-photo">صورة الطفل <span class="opt">(اختياري)</span></label>' +
      '<input id="f-photo" type="file" accept="image/*">' +
      (state.child.photo ? '<button class="btn ghost sm" data-action="photo-remove" style="align-self:flex-start">إزالة الصورة</button>' : '') +
      '<span class="small">تظهر الصورة في صفحة الطوارئ لتساعد على التعرّف على الطفل.</span></div>';
  }
  function field(id, label, v, type, optional) {
    return '<div class="field"><label for="' + id + '">' + label + (optional ? ' <span class="opt">(اختياري)</span>' : '') + '</label><input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(v) + '"' + (type === 'tel' ? ' dir="ltr" style="text-align:right"' : '') + '></div>';
  }
  function editView() {
    var c = state.child;
    var bloods = ['', 'A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'].map(function (b) { return '<option value="' + b + '"' + (b === c.blood ? ' selected' : '') + '>' + (b ? ltr(b) : 'غير محدد') + '</option>'; }).join('');
    var meds = state.meds.map(function (m) { return '<div class="med"><div><div class="n">' + esc(m.name) + '</div><div class="t">' + esc(m.time) + '</div></div></div>'; }).join('');
    return '<button class="btn ghost sm back" data-action="back">' + ic('chev') + 'رجوع</button>' +
      '<section class="card stack"><h2>تعديل بيانات الطفل</h2>' +
      photoBlock() + field('f-name', 'اسم الطفل', c.name) + field('f-allergy', 'الحساسية', c.allergy, 'text', true) + field('f-chronic', 'الأمراض المزمنة', c.chronic, 'text', true) + field('f-emerg', 'دواء الطوارئ', c.emerg, 'text', true) +
      '<div class="field"><label for="f-blood">فصيلة الدم <span class="opt">(اختياري)</span></label><select id="f-blood">' + bloods + '</select></div>' +
      field('f-instr', 'تعليمات قصيرة للمسعف', c.instr, 'text', true) +
      field('f-c1name', 'جهة الاتصال الأساسية: الاسم', c.c1.name) + field('f-c1phone', 'رقم الجوال', c.c1.phone, 'tel') +
      field('f-c2name', 'رقم طوارئ آخر: الاسم أو الصلة', c.c2.name, 'text', true) + field('f-c2phone', 'رقم الجوال', c.c2.phone, 'tel', true) +
      '<button class="btn blue block" data-action="save">حفظ</button></section>' +
      '<section class="card stack"><h2>أدوية الطفل</h2>' + (meds || '<p class="small" style="margin:0">لا يوجد دواء مسجل.</p>') +
      '<div class="field"><label for="m-name">اسم الدواء</label><input id="m-name" type="text"></div>' +
      '<div class="field"><label for="m-time">الموعد</label><input id="m-time" type="time" value="09:00"></div>' +
      '<button class="btn ghost block" data-action="addmed">إضافة دواء</button></section>';
  }

  function footer() {
    return '<footer class="brands"><div class="brandrow"><div class="erawda"><img class="w" src="' + LOGOS.erawda + '" alt="eRawda"><img class="t" src="' + LOGOS.tagline + '" alt="تطبيق رياض الأطفال"></div>' +
      '<span class="vr" aria-hidden="true"></span><img class="ronaq" src="' + LOGOS.ronaq + '" alt="رونق"></div>' +
      '<p class="note" style="font-weight:700">قطعة الأمان من رونق وeRawda</p><p class="note">جميع الحقوق محفوظة ©</p></footer>';
  }

  function render() {
    var v = view();
    var tabView = v === 'edit' ? 'parent' : v;
    document.body.setAttribute('data-view', tabView);
    var body = v === 'teacher' ? teacherView() : v === 'parent' ? parentView() : v === 'edit' ? editView() : emergencyView();
    var tabs = TABS.map(function (k) { return '<button class="tab" data-action="tab" data-view="' + k + '"' + (k === tabView ? ' aria-current="true"' : '') + '>' + LABELS[k] + '</button>'; }).join('');
    app.innerHTML =
      '<div class="demo-bar">نسخة تجريبية ببيانات مستعارة</div>' +
      '<div class="top"><span class="brand">قطعة الأمان</span><span class="date">' + esc(today()) + '</span></div>' +
      body +
      '<div class="stack" style="gap:6px"><p class="note">معاينة للعرض: غيّر زاوية النظر</p><nav class="tabs" aria-label="العروض">' + tabs + '</nav></div>' +
      footer() +
      (state.toast ? '<div class="toast" role="status">' + esc(state.toast) + '</div>' : '');
  }

  function say(msg) {
    state.toast = msg; render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { state.toast = ''; render(); }, 2200);
  }

  function collect() {
    if (!document.getElementById('f-allergy')) return;
    var c = state.child;
    c.name = val('f-name') || c.name;
    c.allergy = val('f-allergy'); c.chronic = val('f-chronic'); c.emerg = val('f-emerg'); c.instr = val('f-instr');
    var b = document.getElementById('f-blood'); c.blood = b ? b.value : c.blood;
    c.c1 = { name: val('f-c1name') || c.c1.name, phone: val('f-c1phone') || c.c1.phone };
    c.c2 = { name: val('f-c2name'), phone: val('f-c2phone') };
  }

  function askLocation() {
    var by = state.found && state.found.by ? state.found.by : 'stranger';
    state.found = { step: 'wait', by: by }; render();
    var done = function (lat, lng) {
      state.found = { step: 'done', by: by, time: nowStr(), lat: lat, lng: lng };
      state.scans.unshift(by === 'teacher'
        ? { when: 'الآن', who: 'معلمة الصف', reg: true, loc: true }
        : { when: 'الآن', who: 'شخص غير مسجل', reg: false, loc: !!lat });
      render();
    };
    try {
      if (!navigator.geolocation) { done(null, null); return; }
      navigator.geolocation.getCurrentPosition(function (p) { done(p.coords.latitude.toFixed(5), p.coords.longitude.toFixed(5)); }, function () { done(null, null); }, { timeout: 8000, maximumAge: 0 });
    } catch (e) { done(null, null); }
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action');
    if (a === 'tab') { location.hash = el.getAttribute('data-view'); }
    else if (a === 'edit') { location.hash = 'edit'; }
    else if (a === 'back') { collect(); location.hash = 'parent'; }
    else if (a === 'give') { var id = +el.getAttribute('data-id'); state.meds.forEach(function (m) { if (m.id === id) m.given = true; }); say('تم تسجيل إعطاء الدواء'); }
    else if (a === 'absent') { state.absent = !state.absent; say(state.absent ? 'تم إبلاغ الروضة بالغياب' : 'تم إلغاء الإبلاغ'); }
    else if (a === 'save') { collect(); location.hash = 'parent'; say('تم حفظ البيانات'); }
    else if (a === 'photo-remove') { collect(); state.child.photo = ''; say('تمت إزالة الصورة'); }
    else if (a === 'addmed') {
      var n = val('m-name'), t = val('m-time');
      collect();
      if (!n) { say('اكتب اسم الدواء أولاً'); return; }
      state.meds.push({ id: Date.now(), name: n, time: t || '09:00', given: false });
      say('تمت إضافة الدواء');
    }
    else if (a === 'found') { state.found = { step: 'ask', by: el.getAttribute('data-by') || 'stranger' }; render(); }
    else if (a === 'found-no') { state.found = null; render(); }
    else if (a === 'found-yes') { askLocation(); }
    else if (a === 'found-preview') { say('هذا الزر يظهر لمن يمسح القطعة'); }
    else if (a === 'copy') {
      var text = el.getAttribute('data-phone') || '';
      try { navigator.clipboard.writeText(text).then(function () { say('تم نسخ الرقم'); }, function () { say('الرقم: ' + text); }); }
      catch (err) { say('الرقم: ' + text); }
    }
  });
  app.addEventListener('change', function (e) {
    if (!e.target || e.target.id !== 'f-photo' || !e.target.files || !e.target.files[0]) return;
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        try {
          var s = Math.min(img.width, img.height), cv = document.createElement('canvas');
          cv.width = cv.height = 240;
          cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 240, 240);
          collect(); state.child.photo = cv.toDataURL('image/jpeg', 0.82); say('تم تحديث الصورة');
        } catch (err) { say('تعذر قراءة الصورة'); }
      };
      img.onerror = function () { say('تعذر قراءة الصورة'); };
      img.src = fr.result;
    };
    fr.readAsDataURL(e.target.files[0]);
  });
  window.addEventListener('hashchange', function () {
    state.found = null; render();
    try { window.scrollTo(0, 0); } catch (e) {}
  });
  render();
})();
</script>

</body></html>
